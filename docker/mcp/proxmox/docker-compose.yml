services:
  proxmox-mcp:
    # Use a versioned image tag for reproducible deployments.
    image: ghcr.io/carsaig/proxmox-mcp:0.5.10-1
    restart: unless-stopped
    environment:
      PROXMOX_HOST: ${PROXMOX_HOST}
      PROXMOX_PORT: ${PROXMOX_PORT}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL}
      SECURITY_DEV_MODE: ${SECURITY_DEV_MODE}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET}
      MCP_PROXY_BEARER_TOKEN: ${MCP_PROXY_BEARER_TOKEN}
    expose:
      - "8080"
    ports:
      - ${MCP_PROXY_PORTS:?MCP_PROXY_PORTS is required}
    networks:
      - default
      - platform
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -qE '200|401'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
