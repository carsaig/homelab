services:
  traefik-mcp:
    image: ghcr.io/carsaig/traefik-mcp:latest
    container_name: traefik-mcp
    restart: unless-stopped
    environment:
      - TRAEFIK_API_URL=${TRAEFIK_API_URL:-http://traefik:8080}
      - MCP_PROXY_BEARER_TOKEN=${MCP_PROXY_BEARER_TOKEN}
      - TRAEFIK_BASIC_AUTH_USERNAME=${TRAEFIK_BASIC_AUTH_USERNAME:-}
      - TRAEFIK_BASIC_AUTH_PASSWORD=${TRAEFIK_BASIC_AUTH_PASSWORD:-}
    ports:
      - "${MCP_PROXY_PORTS:-8080:8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - proxy

networks:
  proxy:
    external: true
