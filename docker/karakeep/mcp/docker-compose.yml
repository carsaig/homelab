services:
  karakeep-mcp:
    image: ghcr.io/carsaig/karakeep-mcp:0.33.0
    restart: unless-stopped
    environment:
      KARAKEEP_API_ADDR: ${KARAKEEP_API_ADDR}
      KARAKEEP_API_KEY: ${KARAKEEP_API_KEY}
      MCP_PROXY_BEARER_TOKEN: ${MCP_PROXY_BEARER_TOKEN}
    ports:
      - ${MCP_PROXY_PORTS:?MCP_PROXY_PORTS is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
