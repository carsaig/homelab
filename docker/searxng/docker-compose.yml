services:
  valkey:
    image: valkey/valkey@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - valkey-data:/data

  searxng:
    image: searxng/searxng@sha256:268fdb05efbb7b4fdc5957a20c42389bfb1b1b27b5eddeb98f75ec80c45b960f
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
      SEARXNG_HEALTHCHECK_URL: ${SEARXNG_HEALTHCHECK_URL}
      SEARXNG_IMAGE_PROXY: ${SEARXNG_IMAGE_PROXY}
      SEARXNG_LIMITER: ${SEARXNG_LIMITER}
      SEARXNG_PUBLIC_INSTANCE: ${SEARXNG_PUBLIC_INSTANCE}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_VALKEY_URL: ${SEARXNG_VALKEY_URL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --header 'X-Real-IP: 127.0.0.1' --user-agent 'SearXNG healthcheck' --spider \"$${SEARXNG_HEALTHCHECK_URL}healthz\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-data:/var/cache/searxng
    ports:
      - ${PORTS}

volumes:
  valkey-data: {}
  searxng-data: {}
