services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && exec 3<&-'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - platform
      - consumers

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
  consumers:
    external: true
    name: ${QDRANT_CONSUMER_NETWORK}

volumes:
  qdrant-data:
    name: ${QDRANT_DATA_VOLUME}
