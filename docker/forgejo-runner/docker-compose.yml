# Forgejo Actions runner for git.certain.cc, on zurich-1.
#
# Jobs run inside a dedicated docker-in-docker daemon rather than against the
# host socket: Arcane manages the whole fleet from this host and has the host
# socket mounted, so a workflow with socket access could reach it.
#
# dns is required. certain.cc is resolved by Tailscale MagicDNS (100.100.100.100)
# via a routed domain on tailscale0; containers do not inherit the host's
# systemd-resolved stub (127.0.0.53) and cannot resolve git.certain.cc without it.
services:
  runner:
    image: code.forgejo.org/forgejo/runner:13.0.0
    container_name: forgejo-runner
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /data
    command: forgejo-runner daemon
    dns:
      - 100.100.100.100
    environment:
      # The dind TLS certificate is issued for the name "docker", not for the
      # service name, so the alias below is what this must point at.
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - ./data:/data
      - certs:/certs
    depends_on:
      - docker-in-docker

  docker-in-docker:
    image: docker:28-dind
    container_name: forgejo-runner-dind
    restart: unless-stopped
    privileged: true
    dns:
      - 100.100.100.100
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      default:
        aliases:
          - docker
    volumes:
      - certs:/certs
      - dind-storage:/var/lib/docker

volumes:
  certs:
  dind-storage:
