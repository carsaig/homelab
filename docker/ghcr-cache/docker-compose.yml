# Pull-through cache for ghcr.io, reachable over the tailnet.
#
# Exists because one host has no public egress: it can reach the tailnet and
# Cloudflare, but not GitHub's registry. Rather than opening that host's egress
# to the world, it pulls through here.
#
# Read-only cache: it holds no images of its own, it only fetches and keeps
# copies of what was asked for. Losing it costs a re-download, nothing else.
#
# PORTS binds it to the private interface only, VOLUME_PATH_DATA points at the
# cache directory. Both come from the stack's environment.
services:
  ghcr-cache:
    image: registry:3
    container_name: ghcr-cache
    restart: unless-stopped
    ports:
      - ${PORTS}
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - ${VOLUME_PATH_DATA}:/var/lib/registry
