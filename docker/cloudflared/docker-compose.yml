services:
  cloudflared:
      image: cloudflare/cloudflared:latest
      container_name: cloudflared
      command: tunnel --no-autoupdate run
      environment:
        TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
      restart: unless-stopped
      networks:
        - platform
networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
