version: "3.8"

networks:
  dokploy-network:
    external: true
  openwebui-internal:
    driver: bridge

volumes:
  openwebui_data:
  openwebui_pg_data:

services:
  openwebui-db:
    image: postgres:16-alpine
    container_name: openwebui-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
      POSTGRES_USER: ${POSTGRES_USER:-openwebui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - openwebui_pg_data:/var/lib/postgresql/data
    networks:
      - openwebui-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openwebui} -d ${POSTGRES_DB:-openwebui}"]
      interval: 10s
      timeout: 5s
      retries: 5

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    depends_on:
      openwebui-db:
        condition: service_healthy
    networks:
      - dokploy-network
      - openwebui-internal
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      # --- Core & Persistence ---
      - ENV=production
      - WEBUI_URL=https://ai.certain.cc
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@openwebui-db:5432/${POSTGRES_DB:-openwebui}

      # --- User Management & Policy ---
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=pending
      - ENABLE_COMMUNITY_SHARING=true
      - SHOW_ADMIN_DETAILS=false

      # --- OAuth Global Settings ---
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true

      # --- 1. Tailscale IDP (Primary OIDC SSO) ---
      - OAUTH_PROVIDER_NAME=Tailscale
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-https://idp.tortoise-bramble.ts.net}
      - OAUTH_CLIENT_ID=${TSIDP_CLIENT_ID:-openwebui}
      - OAUTH_CLIENT_SECRET=${TSIDP_CLIENT_SECRET}
      - OAUTH_SCOPES=openid email profile
      - OAUTH_USERNAME_CLAIM=preferred_username
      - OAUTH_EMAIL_CLAIM=email

      # --- 2. Google OAuth ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

      # --- 3. GitHub OAuth ---
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}

      # --- 4. Microsoft / Azure / Entra ID ---
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID:-}
      - MICROSOFT_REDIRECT_URI=https://ai.certain.cc/oauth/microsoft/callback

      # --- LLM Backend (OmniRoute Gateway) ---
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://bifrost.certain.cc/openai/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # --- Web Search (SearXNG) ---
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>}

      # --- RAG & Embeddings ---
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://bifrost.certain.cc/openai/v1}
      - RAG_OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_EMBEDDING_MODEL=openai/text-embedding-3-large
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=100

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`ai.certain.cc`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=letsencrypt"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
