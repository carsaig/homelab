services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Synapse requires byte-ordering collation on its database.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      # Consumed by the init script (runtime expansion via $$ escape).
      SYNAPSE_DB_USER: ${SYNAPSE_DB_USER}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD}
      MAS_DB_USER: ${MAS_DB_USER}
      MAS_DB_PASSWORD: ${MAS_DB_PASSWORD}
    volumes:
      - matrix-postgres-data:/var/lib/postgresql/data
    configs:
      # No custom mode: default 0444 is world-readable, so postgres sources
      # this at init. (A numeric mode like 0755 gets misparsed as decimal.)
      - source: pg_init
        target: /docker-entrypoint-initdb.d/10-init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [platform]

  # Generates MAS signing keys once into the shared volume (idempotent).
  # MAS is distroless, so a small init container performs key generation.
  mas-keygen:
    image: alpine/openssl@sha256:0a0b910a215ef38890e24526795f11d92c6f1016682fc4ef37fc5c44e23b758f
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -f /keys/rsa.pem ] || openssl genrsa -out /keys/rsa.pem 2048
        [ -f /keys/ec.pem ]  || openssl ecparam -name prime256v1 -genkey -noout -out /keys/ec.pem
        chown 65532:65532 /keys/rsa.pem /keys/ec.pem
        chmod 0400 /keys/rsa.pem /keys/ec.pem
        ls -l /keys
    volumes:
      - matrix-mas-keys:/keys
    networks: [platform]

  mas:
    image: ghcr.io/element-hq/matrix-authentication-service@sha256:73bb86fb8f412082829e603417b2df3e351bbda79bedaa46beb0f3f533bdcc1c
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mas-keygen:
        condition: service_completed_successfully
    command: ["server", "-c", "/config.yaml"]
    configs:
      - source: mas_config
        target: /config.yaml
    volumes:
      - matrix-mas-keys:/keys:ro
    networks: [platform]

  # Generates the Synapse signing key once into the data volume (idempotent).
  synapse-keygen:
    image: ghcr.io/element-hq/synapse@sha256:6345789f58048687f3024a99d3d59b5444fc9cc1de61d2947000cbac89573fcb
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -f /data/signing.key ] || python -m synapse._scripts.generate_signing_key -o /data/signing.key
        # Synapse "run" mode drops to 991:991 but does not chown /data itself.
        chown -R 991:991 /data
        ls -ln /data
    volumes:
      - matrix-synapse-data:/data
    networks: [platform]

  synapse:
    image: ghcr.io/element-hq/synapse@sha256:6345789f58048687f3024a99d3d59b5444fc9cc1de61d2947000cbac89573fcb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse-keygen:
        condition: service_completed_successfully
      mas:
        condition: service_started
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    configs:
      - source: synapse_config
        target: /config/homeserver.yaml
      - source: synapse_log_config
        target: /config/log.config
    volumes:
      - matrix-synapse-data:/data
    networks: [platform]

  # Serves the server discovery document not provided by Synapse.
  wellknown:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    configs:
      - source: wk_nginx
        target: /etc/nginx/conf.d/default.conf
      - source: wk_server
        target: /usr/share/nginx/html/.well-known/matrix/server
    networks: [platform]

  # Matrix-level administration for rooms, media, and server settings.
  synapse-admin:
    image: ghcr.io/etkecc/synapse-admin@sha256:ce1eaf7d890f44c0e40896dcbee9e560484a5b6953ffd3deaf2ecc625a74dc25
    restart: unless-stopped
    configs:
      - source: synapse_admin_config
        target: /app/config.json
    networks: [platform]

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:?PLATFORM_NETWORK is required}

volumes:
  matrix-postgres-data:
  matrix-mas-keys:
  matrix-synapse-data:

configs:
  pg_init:
    content: |
      #!/bin/bash
      set -e
      psql -v ON_ERROR_STOP=1 --username "$${POSTGRES_USER}" --dbname postgres <<-EOSQL
        CREATE ROLE "$${SYNAPSE_DB_USER}" LOGIN PASSWORD '$${SYNAPSE_DB_PASSWORD}';
        CREATE DATABASE synapse OWNER "$${SYNAPSE_DB_USER}" ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' TEMPLATE template0;
        CREATE ROLE "$${MAS_DB_USER}" LOGIN PASSWORD '$${MAS_DB_PASSWORD}';
        CREATE DATABASE mas OWNER "$${MAS_DB_USER}" ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' TEMPLATE template0;
      EOSQL

  mas_config:
    content: |
      http:
        listeners:
          - name: web
            resources:
              - name: discovery
              - name: human
              - name: oauth
              - name: compat
              - name: graphql
              - name: assets
            binds:
              - address: '[::]:8080'
            proxy_protocol: false
          - name: internal
            resources:
              - name: health
            binds:
              - host: localhost
                port: 8081
            proxy_protocol: false
        trusted_proxies:
          - ${MAS_TRUSTED_PROXY_CIDR:?MAS_TRUSTED_PROXY_CIDR is required}
        public_base: ${MAS_PUBLIC_BASE}
        issuer: ${MAS_PUBLIC_BASE}
      database:
        host: postgres
        port: 5432
        username: ${MAS_DB_USER}
        password: ${MAS_DB_PASSWORD}
        database: mas
        max_connections: 10
      email:
        # blackhole transport discards mail; domain is irrelevant/non-routable.
        from: '"Service" <noreply@localhost>'
        reply_to: '"Service" <noreply@localhost>'
        transport: blackhole
      secrets:
        encryption: ${MAS_ENCRYPTION_SECRET}
        keys:
          - key_file: /keys/rsa.pem
          - key_file: /keys/ec.pem
      passwords:
        enabled: true
        schemes:
          - version: 1
            algorithm: argon2id
      matrix:
        kind: synapse
        homeserver: ${MATRIX_SERVER_NAME}
        secret: ${MAS_SYNAPSE_SECRET}
        endpoint: http://synapse:8008/
      account:
        password_registration_enabled: ${MAS_PASSWORD_REGISTRATION_ENABLED:?MAS_PASSWORD_REGISTRATION_ENABLED is required}
        password_registration_token_required: true
      upstream_oauth2:
        providers:
          - id: ${MAS_UPSTREAM_PROVIDER_ID:?MAS_UPSTREAM_PROVIDER_ID is required}
            human_name: ${MAS_UPSTREAM_PROVIDER_NAME:?MAS_UPSTREAM_PROVIDER_NAME is required}
            issuer: ${OIDC_ISSUER:?OIDC_ISSUER is required}
            client_id: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
            client_secret: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
            token_endpoint_auth_method: client_secret_post
            scope: "openid email profile"
            discovery_mode: oidc
            pkce_method: auto
            claims_imports:
              subject:
                template: "{{ user.sub }}"
              localpart:
                action: suggest
                template: "{{ user.preferred_username }}"
              displayname:
                action: suggest
                template: "{{ user.name }}"
              email:
                action: suggest
                template: "{{ user.email }}"

  synapse_config:
    content: |
      server_name: ${MATRIX_SERVER_NAME}
      public_baseurl: ${MATRIX_PUBLIC_BASEURL}
      pid_file: /data/homeserver.pid
      signing_key_path: /data/signing.key
      media_store_path: /data/media_store
      report_stats: false
      log_config: /config/log.config
      listeners:
        - port: 8008
          tls: false
          type: http
          x_forwarded: true
          resources:
            - names: [client, federation]
              compress: false
      database:
        name: psycopg2
        args:
          user: ${SYNAPSE_DB_USER}
          password: ${SYNAPSE_DB_PASSWORD}
          database: synapse
          host: postgres
          port: 5432
          cp_min: 5
          cp_max: 10
      # Auth fully delegated to MAS (MSC3861 stable block). Shared secret
      # must equal MAS matrix.secret (= MAS_SYNAPSE_SECRET).
      matrix_authentication_service:
        enabled: true
        endpoint: http://mas:8080/
        secret: ${MAS_SYNAPSE_SECRET}
      # MSC4140 delayed events: required for matrix_2_0 (Element X) call membership.
      max_event_delay_duration: 24h
      rc_delayed_event_mgmt:
        per_second: 1000
        burst_count: 1000
      # MSC4354: Element Call's matrix_2_0 mode checks for this; without it the
      # web client falls back to oldest_membership (incompatible with Element X's
      # multi_sfu). Enabling it lets both sides negotiate multi_sfu.
      experimental_features:
        msc4354_enabled: true
      # Element Call SFU discovery served natively in .well-known/matrix/client.
      extra_well_known_client_content:
        org.matrix.msc4143.rtc_foci:
          - type: livekit
            livekit_service_url: ${LIVEKIT_JWT_URL}
      # Native auth off (MAS owns it).
      enable_registration: false
      password_config:
        enabled: false
      macaroon_secret_key: ${SYNAPSE_MACAROON_SECRET}
      form_secret: ${SYNAPSE_FORM_SECRET}
      trusted_key_servers: []
      suppress_key_server_warning: true

  synapse_log_config:
    content: |
      version: 1
      formatters:
        precise:
          format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
      handlers:
        console:
          class: logging.StreamHandler
          formatter: precise
      loggers:
        synapse.storage.SQL:
          level: WARNING
      root:
        level: INFO
        handlers: [console]
      disable_existing_loggers: false

  synapse_admin_config:
    content: |
      {
        "restrictBaseUrl": ["https://${MATRIX_SERVER_NAME}"]
      }

  wk_nginx:
    content: |
      server {
        listen 80;
        location = /.well-known/matrix/server {
          default_type application/json;
          add_header Access-Control-Allow-Origin *;
          root /usr/share/nginx/html;
        }
      }

  wk_server:
    content: |
      { "m.server": "${MATRIX_SERVER_NAME}:443" }
