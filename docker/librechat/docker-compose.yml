services:
  api:
    container_name: librechat-api
    image: ghcr.io/danny-avila/librechat:v0.8.8-rc2
    restart: always
    depends_on:
      - mongodb
      - redis
      - meilisearch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Logins
      - ALLOW_SOCIAL_REGISTRATION: true
      - ALLOW_SOCIAL_LOGIN: true
      - ALLOW_EMAIL_LOGIN: true
      - ALLOW_REGISTRATION: true
      - LOGIN_MAX: 1000
      - LOGIN_WINDOW: 1

    # Base Config
      - APP_TITLE: LibreChat
      - DOMAIN_HOST: ${DOMAIN_HOST}
      - DOMAIN_CLIENT: http://localhost:3080
      - DOMAIN_SERVER: http://localhost:3080
      - DEBUG_CONSOLE: true
      - DB_PORT: 5432
      - HOST: 0.0.0.0
      - PORT: 3080
      - PLATFORM_NETWORK: dokploy-network
      - ENABLE_STATIC_ASSET_BROTLI: true
      - ENABLE_IMAGE_OUTPUT_GZIP_SCAN: true
      - DISABLE_COMPRESSION: true
      - NODE_ENV: production
      - NO_INDEX: true
      - DEPLOYMENT_SKILLS_DIR: ./skill
      - DEPLOYMENT_PLUGINS_DIR: ./plugin
      - DEPLOYMENT_PLUGIN_DATA_DIR: ./data/plugins
      - DEPLOYMENT_PLUGIN_HOOKS: true
      - ENDPOINTS: agents,assistants,gptPlugins,custom
      - USE_REDIS: true
      - USE_REDIS_STREAMS: true
      - TRUST_PROXY: 2
      - SCHEDULES_SINGLE_PROCESS: true

    # OIDC
      - OIDC_HOST: idp.tortoise-bramble.ts.net:185.40.234.198
      - OPENID_GENERATE_NONCE: true
      - OPENID_ISSUER: https://idp.tortoise-bramble.ts.net
      - OPENID_CALLBACK_URL: /oauth/openid/callback
      - OPENID_SCOPE: openid profile email
      - OPENID_BUTTON_LABEL: Login with Tailscale
      - OPENID_IMAGE_URL: https://tailscale.com/favicon.ico
      - GOOGLE_CALLBACK_URL: /oauth/google/callback

    # Inference
      - LLM_PROVIDER: Omniroute
      - LLM_GATEWAY_NAME: Omniroute
      - LLM_MODEL: coding-adaptive
      - LLM_GATEWAY_BASEURL: http://omniroute:8000/v1
      - SUMMARY_MODEL: cinf/gpt-5.4-mini
      - MODEL_DISPLAY_LABEL: Omniroute
      - MCP_URL: http://bifrost:8080/mcp
     # - COHERE_API_KEY: ${COHERE_API_KEY:-}

    # Web-Suche & Reranker (SearXNG)
      #TAVILY_SEARCH_URL:
      #TAVILY_EXTRACT_URL:
      - SEARXNG_INSTANCE_URL: http://searxng:8080
      # SEARXNG_API_KEY=

    # Meilisearch Volltextsuche
      - SEARCH: true
      - MEILI_HOST: http://meilisearch:7700
      - MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      - RAG_API_URL: ${RAG_API_URL:-http://rag-api:8000}
      - RAG_PORT: 8000

      # The API sends the browser back to ${ADMIN_PANEL_URL}/auth/openid/callback once
      # the identity provider has authenticated an administrator. Without it the redirect
      # falls back to the panel's container-internal address and the callback is lost.

    entrypoint: ["/bin/sh", "/patches/entrypoint-patch.sh"]
    command: ["npm", "run", "backend"]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./entrypoint-patch.sh:/patches/entrypoint-patch.sh:ro
      - librechat_images:/app/client/public/images
      - librechat_logs:/app/api/logs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK:-dokploy-network}"
      - "traefik.http.routers.librechat-web.entrypoints=web"
      - "traefik.http.routers.librechat-web.rule=Host(`${DOMAIN_HOST}`)"
      - "traefik.http.routers.librechat-web.service=librechat-service"
      - "traefik.http.routers.librechat-websecure.entrypoints=websecure"
      - "traefik.http.routers.librechat-websecure.rule=Host(`${DOMAIN_HOST}`)"
      - "traefik.http.routers.librechat-websecure.service=librechat-service"
      - "traefik.http.routers.librechat-websecure.tls=true"
      - "traefik.http.routers.librechat-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat-service.loadbalancer.server.port=3080"
    networks:
      - default
      - platform

  admin-panel:
    container_name: librechat-admin-panel
    image: ghcr.io/clickhouse/librechat-admin-panel:latest@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
    restart: always
    depends_on:
      - api
    environment:
      - API_SERVER_URL: http://api:${HOST_PORT:-3080}
      - VITE_API_BASE_URL: https://${DOMAIN_HOST}
      # The panel is published on its own host and serves itself from /admin there, which
      # is the layout its bundle is built for.
      - VITE_BASE_PATH: /admin
      - DOMAIN_CLIENT: http://localhost:3080
      - DOMAIN_SERVER: http://localhost:3080
      - SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      - ADMIN_PANEL_SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      - ADMIN_PANEL_SESSION_COOKIE_SECURE: true
      - SESSION_COOKIE_SECURE: true
      - ADMIN_SSO_ONLY: true
      - ADMIN_SESSION_IDLE_TIMEOUT_MS: 1800000
      - ADMIN_PANEL_PORT: 3000
      - ADMIN_PANEL_HOST: ${ADMIN_PANEL_HOST}
      - ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK:-dokploy-network}"
      - "traefik.http.routers.librechat-admin-web.entrypoints=web"
      - "traefik.http.routers.librechat-admin-web.rule=Host(`${ADMIN_PANEL_HOST}`)"
      - "traefik.http.routers.librechat-admin-web.service=librechat-admin-service"
      - "traefik.http.routers.librechat-admin-websecure.entrypoints=websecure"
      - "traefik.http.routers.librechat-admin-websecure.rule=Host(`${ADMIN_PANEL_HOST}`)"
      - "traefik.http.routers.librechat-admin-websecure.service=librechat-admin-service"
      - "traefik.http.routers.librechat-admin-websecure.tls=true"
      - "traefik.http.services.librechat-admin-service.loadbalancer.server.port=3000"
    networks:
      - default
      - platform

  meilisearch:
    container_name: librechat-meilisearch
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      - MEILI_HOST: http://0.0.0.0:7700
      - MEILI_NO_ANALYTICS: true
      - MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - default

  mongodb:
    container_name: librechat-mongodb
    image: mongo:7.0
    restart: always
    volumes:
      - mongodb_data:/data/db

  redis:
    container_name: librechat-redis
    image: redis:7-alpine
    restart: always

  rag-api:
    container_name: librechat-rag-api
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    restart: always
    depends_on:
      - vectordb
    environment:
      - DB_HOST: ${DB_HOST}
      - DB_PORT: 5432
      - POSTGRES_USER: ${POSTGRES_USER}
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      - POSTGRES_DB: ${POSTGRES_DB}
      - RAG_PORT: 8000
      - RAG_API_URL: ${RAG_API_URL}
      - COLLECTION_NAME: librechat
      - EMBEDDINGS_PROVIDER: openai
      - EMBEDDINGS_MODEL: embedding-openai
      - RAG_OPENAI_BASEURL: ${LLM_GATEWAY_BASEURL}
      - RAG_OPENAI_API_KEY: ${LLM_GATEWAY_API_KEY_ADMIN}
      - OPENAI_API_KEY: ${LLM_GATEWAY_API_KEY_ADMIN}
      - CHUNK_SIZE: 1500
      - CHUNK_OVERLAP: 100

  vectordb:
    container_name: librechat-vectordb
    image: pgvector/pgvector:0.8.0-pg17
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  librechat_images:
  librechat_logs:
  pgvector_data:
  meilisearch_data:

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
