services:
  api:
    image: ghcr.io/danny-avila/librechat:v0.8.8-rc2
    restart: always
    depends_on:
      - mongodb
      - redis
      - meilisearch
    extra_hosts:
      - ${DOCKER_HOST}
      - ${OIDC_HOST}
    env_file:
      - .env
    environment:
      - HOST=${HOST}
      - PORT=${HOST_PORT}
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - SEARCH=true
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - RAG_API_URL=${RAG_API_URL}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
    entrypoint: ["/bin/sh", "/patches/entrypoint-patch.sh"]
    command: ["npm", "run", "backend"]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./entrypoint-patch.sh:/patches/entrypoint-patch.sh:ro
      - librechat_images:/app/client/public/images
      - librechat_logs:/app/api/logs
    labels:
      - "${LIBRECHAT_MIDDLEWARE_LABEL}"
    networks:
      - default
      - platform

  admin-panel:
    image: ghcr.io/clickhouse/librechat-admin-panel:latest@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
    restart: always
    depends_on:
      - api
    environment:
      - API_SERVER_URL=http://api:${HOST_PORT}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT}
      - DOMAIN_SERVER=${DOMAIN_SERVER}
      - ADMIN_PANEL_SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - ADMIN_PANEL_SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-true}
      - ADMIN_SSO_ONLY=${ADMIN_SSO_ONLY:-true}
      - ADMIN_SESSION_IDLE_TIMEOUT_MS=${ADMIN_SESSION_IDLE_TIMEOUT_MS:-1800000}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK}"
      - "traefik.http.routers.librechat-admin-http.entrypoints=web"
      - "traefik.http.routers.librechat-admin-http.rule=Host(`${ADMIN_PANEL_HOST}`)"
      - "traefik.http.routers.librechat-admin-http.middlewares=redirect-to-https"
      - "traefik.http.routers.librechat-admin-https.entrypoints=websecure"
      - "traefik.http.routers.librechat-admin-https.rule=Host(`${ADMIN_PANEL_HOST}`)"
      - "traefik.http.routers.librechat-admin-https.tls=true"
      - "traefik.http.routers.librechat-admin-https.tls.certresolver=letsencrypt-dns"
      - "traefik.http.services.librechat-admin.loadbalancer.server.port=3000"
    networks:
      - default
      - platform

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      - MEILI_HOST=http://0.0.0.0:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - default

  mongodb:
    image: mongo:7.0
    restart: always
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    restart: always

  rag-api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RAG_PORT=${RAG_PORT}
      - COLLECTION_NAME=librechat
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - RAG_OPENAI_BASEURL=${LLM_GATEWAY_BASEURL}
      - RAG_OPENAI_API_KEY=${LLM_GATEWAY_API_KEY_ADMIN}
      - CHUNK_SIZE=1500
      - CHUNK_OVERLAP=100

  vectordb:
    image: pgvector/pgvector:0.8.0-pg17
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  librechat_images:
  librechat_logs:
  pgvector_data:
  meilisearch_data:

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
