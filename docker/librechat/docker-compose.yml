services:
  api:
    image: ghcr.io/danny-avila/librechat:v0.8.8-rc2
    restart: always
    depends_on:
      - mongodb
      - redis
      - meilisearch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${HOST_PORT:-3080}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - USE_REDIS=${USE_REDIS:-true}
      - USE_REDIS_STREAMS=${USE_REDIS_STREAMS:-true}
      - SCHEDULES_SINGLE_PROCESS=${SCHEDULES_SINGLE_PROCESS:-true}
      - TRUST_PROXY=${TRUST_PROXY:-2}
      - SEARCH=true
      - MEILI_HOST=${MEILI_HOST:-http://meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - RAG_API_URL=${RAG_API_URL:-http://rag-api:8000}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-http://localhost:3080}
      - APP_TITLE=${APP_TITLE:-LibreChat}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-true}
      - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-true}
      - LOGIN_MAX=${LOGIN_MAX:-1000}
      - LOGIN_WINDOW=${LOGIN_WINDOW:-1}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - OPENID_CLIENT_ID=${OPENID_CLIENT_ID:-}
      - OPENID_CLIENT_SECRET=${OPENID_CLIENT_SECRET:-}
      - OPENID_ISSUER=${OPENID_ISSUER:-}
      - OPENID_SESSION_SECRET=${OPENID_SESSION_SECRET:-}
      - OPENID_CALLBACK_URL=${OPENID_CALLBACK_URL:-}
      - OPENID_SCOPE=${OPENID_SCOPE:-}
      - OPENID_BUTTON_LABEL=${OPENID_BUTTON_LABEL:-}
      - OPENID_IMAGE_URL=${OPENID_IMAGE_URL:-}
      - OPENID_GENERATE_NONCE=${OPENID_GENERATE_NONCE:-}
      - LLM_GATEWAY_NAME=${LLM_GATEWAY_NAME:-Omniroute}
      - LLM_GATEWAY_BASEURL=${LLM_GATEWAY_BASEURL:-http://omniroute:8000/v1}
      - LLM_GATEWAY_AUTH=${LLM_GATEWAY_AUTH:-}
      - LLM_GATEWAY_API_KEY_ADMIN=${LLM_GATEWAY_API_KEY_ADMIN:-${LLM_GATEWAY_AUTH:-}}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.6-sol}
      - LLM_PROVIDER=${LLM_PROVIDER:-openAI}
      - MODEL_DISPLAY_LABEL=${MODEL_DISPLAY_LABEL:-Omniroute}
      - MCP_URL=${MCP_URL:-http://bifrost:8080/mcp}
      - MCP_GATEWAY_AUTH=${MCP_GATEWAY_AUTH:-}
      - MCP_GATEWAY_API_KEY_ADMIN=${MCP_GATEWAY_API_KEY_ADMIN:-}
      - SEARXNG_INSTANCE_URL=${SEARXNG_INSTANCE_URL:-http://searxng:8080}
      - SEARXNG_API_KEY=${SEARXNG_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - SUMMARY_MODEL=${SUMMARY_MODEL:-gpt-5.4-mini}
      - SUPERMEMORY_API_KEY=${SUPERMEMORY_API_KEY:-}
      - DEBUG_CONSOLE=${DEBUG_CONSOLE:-false}
      - ENABLE_STATIC_ASSET_BROTLI=${ENABLE_STATIC_ASSET_BROTLI:-true}
      - ENABLE_IMAGE_OUTPUT_GZIP_SCAN=${ENABLE_IMAGE_OUTPUT_GZIP_SCAN:-true}
      - DISABLE_COMPRESSION=${DISABLE_COMPRESSION:-false}
      - NODE_ENV=${NODE_ENV:-production}
    entrypoint: ["/bin/sh", "/patches/entrypoint-patch.sh"]
    command: ["npm", "run", "backend"]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./entrypoint-patch.sh:/patches/entrypoint-patch.sh:ro
      - librechat_images:/app/client/public/images
      - librechat_logs:/app/api/logs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK:-dokploy-network}"
      - "traefik.http.routers.librechat-web.entrypoints=web"
      - "traefik.http.routers.librechat-web.rule=Host(`${DOMAIN_HOST}`)"
      - "traefik.http.routers.librechat-web.service=librechat-service"
      - "traefik.http.routers.librechat-websecure.entrypoints=websecure"
      - "traefik.http.routers.librechat-websecure.rule=Host(`${DOMAIN_HOST}`)"
      - "traefik.http.routers.librechat-websecure.service=librechat-service"
      - "traefik.http.routers.librechat-websecure.tls=true"
      - "traefik.http.routers.librechat-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat-service.loadbalancer.server.port=3080"
    networks:
      - default
      - platform

  admin-panel:
    image: ghcr.io/clickhouse/librechat-admin-panel:latest@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
    restart: always
    depends_on:
      - api
    environment:
      - API_SERVER_URL=http://api:${HOST_PORT:-3080}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-http://localhost:3080}
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - ADMIN_PANEL_SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - ADMIN_PANEL_SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-true}
      - ADMIN_SSO_ONLY=${ADMIN_SSO_ONLY:-true}
      - ADMIN_SESSION_IDLE_TIMEOUT_MS=${ADMIN_SESSION_IDLE_TIMEOUT_MS:-1800000}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK:-dokploy-network}"
      - "traefik.http.routers.librechat-admin-web.entrypoints=web"
      - "traefik.http.routers.librechat-admin-web.rule=Host(`${DOMAIN_HOST}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.librechat-admin-web.priority=200"
      - "traefik.http.routers.librechat-admin-web.service=librechat-admin-service"
      - "traefik.http.routers.librechat-admin-websecure.entrypoints=websecure"
      - "traefik.http.routers.librechat-admin-websecure.rule=Host(`${DOMAIN_HOST}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.librechat-admin-websecure.priority=200"
      - "traefik.http.routers.librechat-admin-websecure.service=librechat-admin-service"
      - "traefik.http.routers.librechat-admin-websecure.tls=true"
      - "traefik.http.routers.librechat-admin-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat-admin-service.loadbalancer.server.port=3000"
    networks:
      - default
      - platform

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      - MEILI_HOST=http://0.0.0.0:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - default

  mongodb:
    image: mongo:7.0
    restart: always
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    restart: always

  rag-api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    restart: always
    depends_on:
      - vectordb
    environment:
      - DB_HOST=${DB_HOST:-vectordb}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-librechat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-librechat}
      - RAG_PORT=${RAG_PORT:-8000}
      - COLLECTION_NAME=librechat
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-text-embedding-3-small}
      - RAG_OPENAI_BASEURL=${LLM_GATEWAY_BASEURL:-http://omniroute:8000/v1}
      - RAG_OPENAI_API_KEY=${LLM_GATEWAY_API_KEY_ADMIN:-dummy-key}
      - OPENAI_API_KEY=${LLM_GATEWAY_API_KEY_ADMIN:-dummy-key}
      - CHUNK_SIZE=1500
      - CHUNK_OVERLAP=100

  vectordb:
    image: pgvector/pgvector:0.8.0-pg17
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-librechat}
      - POSTGRES_USER=${POSTGRES_USER:-librechat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  librechat_images:
  librechat_logs:
  pgvector_data:
  meilisearch_data:

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-dokploy-network}
