version: "1.3.14"
cache: true

# ROLLENBERECHTIGUNGEN STEHEN NICHT MEHR HIER.
#
# LibreChat schreibt jedes unter `interface:` gesetzte Berechtigungsfeld bei
# JEDEM Start in die Rollen ADMIN und USER -- beide bekommen denselben Wert.
# Eine privilegierte Admin-Rolle laesst sich so nicht von einer
# eingeschraenkten Nutzerrolle unterscheiden. Fehlt ein Feld, meldet LibreChat
# "Preserving existing permissions" und laesst die Datenbank unangetastet.
# Die Doku bezeichnet den Weg ueber diese Datei als "deprecated for ongoing
# management"; Verwaltung laeuft ueber das Admin-Panel.
#
# Betroffene Felder, die deshalb bewusst fehlen:
#   agents, remoteAgents, skills, prompts, mcpServers, sharedLinks,
#   peoplePicker, marketplace, memories, bookmarks, multiConvo,
#   temporaryChat, runCode, webSearch, fileSearch, fileCitations
#
# Rollen in der Datenbank: ADMIN, USER (Quarantaene), STUDENT, TEACHER.
# STUDENT und TEACHER sind eigene Rollen und werden vom Seeder nie beruehrt.

interface:
  # Reine Oberflaechenschalter -- diese erzeugen keine Rollenberechtigung.
  modelSelect: true      # Modellauswahl in der Oberflaeche; Voraussetzung fuer modelSpecs.addedEndpoints
  parameters: true       # Temperature, Top-P, max_tokens im Seitenpanel
  presets: true          # Voreinstellungen speichern und wiederverwenden
  contextUsage: true     # verbrauchte Tokens pro Gespraech anzeigen

  # Datenschutz und Nutzungsbedingungen als Links in der Fussleiste, ohne
  # Zustimmungsdialog. Die Seiten liefert der Service 'legal' auf derselben
  # Domain aus; relative Pfade halten den Hostnamen aus dieser Datei heraus.
  privacyPolicy:
    externalUrl: "/privacy"
    openNewTab: true
  termsOfService:
    externalUrl: "/terms"
    openNewTab: true

  # Bewusst nicht gesetzt:
  # - contextCost: Kosten in der Oberflaeche; Verbrauch reicht, Kosten stehen
  #   im Admin-Insights-Dashboard (ENABLE_INSIGHTS ist gesetzt)
  # - termsOfService.modalAcceptance: erzwungene Zustimmung, kommt mit der
  #   Safety-Phase statt jetzt
  # - customWelcome: Begruessungstext, unterstuetzt {{user.name}}
  # - defaultPinnedTools: Werkzeuge, die von Anfang an angeheftet sind
  # - endpointsMenu: deprecated, durch modelSelect ersetzt

# Ablageort hochgeladener Dateien. LibreChat legt unter den Praefixen
# images/ und avatars/ ab. Feinere Steuerung ginge ueber fileStrategies
# mit getrennten Zielen fuer avatar, image und document.
fileStrategy: s3

# Dateien: Limits, erlaubte Typen und Bildausgabe.
# Einheit aller *SizeLimit-Werte ist MB.
fileConfig:
  # Harte Obergrenze des Servers, unabhaengig vom Endpunkt.
  serverFileSizeLimit: 512
  avatarSizeLimit: 2
  # Obergrenze fuer Text, der aus einer Datei in den Kontext gezogen wird.
  fileTokenLimit: 100000

  endpoints:
    # Gilt fuer jeden Endpunkt ohne eigenen Eintrag.
    default:
      fileLimit: 10
      fileSizeLimit: 100
      totalSizeLimit: 500
      supportedMimeTypes:
        - '^image/(jpeg|png|gif|webp|heic|heif|svg\+xml)$'
        - '^application/pdf$'
        - '^application/epub\+zip$'
        - '^application/vnd\.openxmlformats-officedocument\..*$'
        - '^application/vnd\.ms-(word|powerpoint|excel)$'
        - '^application/vnd\.oasis\.opendocument\..*$'
        - '^text/.*$'
        - '^application/(json|xml|x-yaml|toml|rtf)$'

  # Text, der beim Upload extrahiert und als Kontext uebergeben wird.
  text:
    supportedMimeTypes:
      - '^text/(plain|markdown|csv|json|xml|html|css|javascript|typescript|x-python|x-java|x-csharp|x-php|x-ruby|x-go|x-rust|x-kotlin|x-swift|x-scala|x-perl|x-lua|x-shell|x-sql|x-yaml|x-toml)$'

  # Von Modellen erzeugte Bilder.
  imageGeneration:
    percentage: 100
    px: 1024

  # Noch nicht aktiv, weil der jeweilige Dienst fehlt:
  # ocr.supportedMimeTypes  -> braucht einen konfigurierten ocr-Block
  # stt.supportedMimeTypes  -> braucht einen konfigurierten speech.stt-Block


registration:
  socialLogins:
    - google
    - openid

endpoints:
  custom:
    # Der Gateway laeuft auf einem anderen Host. Erreichbar ist er ueber das
    # Tailnet -- deshalb steht die Adresse in einer Variablen und nicht hier;
    # ein Containername aus einem fremden Docker-Netz kann nicht aufloesen.
    - name: "Omniroute"
      apiKey: "${LLM_GATEWAY_AUTH}"
      baseURL: "${LLM_GATEWAY_URL}"
      # Die Modellliste holt LibreChat beim Gateway ab; sichtbar ist genau das,
      # was der hinterlegte Schluessel dort freigeschaltet hat. 'default' legt
      # nur fest, was ohne Auswahl vorbelegt ist.
      models:
        default:
          - "coding - adaptive"
        fetch: true
      titleConvo: true
      titleModel: "coding - adaptive"
      modelDisplayLabel: "Omniroute"

    # Zweiter Gateway, derselbe Host, anderer Port. Bedient auch die
    # Sprachendpunkte weiter unten.
    #
    # fetch steht auf false, und das ist keine Bequemlichkeit: der Gateway
    # meldet rund 1500 Modelle und braucht dafuer etwa zehn Sekunden.
    # LibreChats Abruf bricht nach fuenf ab -- der Wert steht als Konstante
    # im Bundle und laesst sich nicht konfigurieren. Die Liste unten ist
    # ausserdem die brauchbarere Oberflaeche: jeder Eintrag ist einzeln
    # angefragt worden und hat auf Deutsch geantwortet.
    #
    # Die Praefixe des Gateways sind grossgeschrieben. 'eurouter/' wird nicht
    # als Anbieter erkannt, faellt auf einen Standardanbieter durch und
    # erzeugt Fehler, die nach etwas ganz anderem aussehen.
    - name: "Bifrost"
      apiKey: "${BIFROST_AUTH}"
      baseURL: "${BIFROST_URL}"
      # Der Gateway ist fuer LibreChat beides: Modellanbieter UND MCP-Server.
      # Ohne diese Kopfzeile haengt er seine MCP-Werkzeuge zusaetzlich an jede
      # Anfrage. Das Modell ruft dann etwas auf, das LibreChat nie deklariert
      # hat, die Antwort traegt tool_calls ausserhalb der eigenen Registrierung
      # und der Agentenlauf bricht mit "Unhandled error type" ab.
      #
      # Leerer Wert heisst laut Doku deny-all: kein MCP-Client steuert
      # Werkzeuge zu dieser Anfrage bei. LibreChats eigener MCP-Client ist
      # nicht betroffen -- der spricht den /mcp-Endpunkt an, nicht diesen.
      headers:
        x-bf-mcp-include-clients: ""
      models:
        default:
          # Anbieter in der EU, alle unter zwei Sekunden bis auf qwen3.8
          - "Eurouter/glm-5.3"
          - "Eurouter/deepseek-v4-pro"
          - "Eurouter/deepseek-v4-flash-0731"
          - "Eurouter/qwen3.8-27b"
          - "Eurouter/kimi-k3"
          - "Eurouter/minimax-m3"
          - "Eurouter/gpt-5.6-sol"
          # Ausserhalb der EU, dafuer mit Guthaben
          - "Cheapinference/gemini-3.7-flash"
          - "Cheapinference/claude-opus-5-fast"
          - "Cheapinference/gpt-6-astra"
          - "gemini/gemini-3.5-flash"
          - "gemini/gemini-3.1-pro-preview"
        fetch: false
      titleConvo: true
      # Bewusst nicht die flash-Variante: die verbraucht das Token-Budget
      # fuer den internen Denkschritt und liefert einen leeren Titel.
      titleModel: "Eurouter/deepseek-v4-pro"
      modelDisplayLabel: "Bifrost"

# Texterkennung fuer hochgeladene Dokumente.
#
# Zur Strategie: "azure_mistral_ocr" heisst nach Azure, meint aber nur eine
# andere Uebertragungsform. Sie schickt das Dokument als base64-Daten-URI
# direkt an /ocr. Die Variante "mistral_ocr" wuerde die Datei vorher ueber
# POST /files hochladen und sich eine signierte URL geben lassen -- und
# genau dieser Upload ist am Gateway nicht verfuegbar: der native Anbieter
# verlangt aktivierte Batch-APIs, der selbst angelegte meldet
# "file_upload is not supported". Der Weg ohne Upload funktioniert.
#
# Sobald dieser Block existiert, laufen ALLE PDFs darueber statt durch den
# lokalen Parser -- getUploadExtractedTextPlan entscheidet anhand von
# ocrConfigured. Der Gewinn: auch gescannte Dokumente ohne Textebene werden
# lesbar, und das Ergebnis ist Text, den jedes Modell versteht.
ocr:
  strategy: "azure_mistral_ocr"
  # Der Anbieterpraefix ist Teil des Bezeichners und gross geschrieben --
  # ohne ihn faellt die Anfrage auf einen Standardanbieter, der kein OCR kann.
  mistralModel: "mistral/mistral-ocr-4-1"
  apiKey: "${OCR_API_KEY}"
  baseURL: "${OCR_BASEURL}"
  # Wie bei Sprache: der SSRF-Schutz sperrt den Bereich, in dem der Gateway
  # liegt, und dieses Feld wird vor der Aufloesung von ${...} geprueft.
  allowedAddresses:
    - "zurich.tortoise-bramble.ts.net:20100"

# Sprache: Diktat (STT) und Vorlesen (TTS).
#
# Beide Richtungen laufen ueber den MCP-/Modell-Gateway, nicht direkt zu einem
# Anbieter -- ein Anbieterwechsel ist damit eine Modellzeile, kein neuer
# Schluessel und keine neue Abrechnung. Der Provider heisst bei LibreChat
# 'openai', beschreibt aber nur das Protokoll: gesetzt ist ein 'url'-Feld,
# der Vorgabewert api.openai.com wird nie erreicht.
#
# allowedAddresses ist Pflicht, nicht Kosmetik: der SSRF-Schutz sperrt den
# CGNAT-Bereich aus RFC 6598 -- also genau den, in dem der Gateway liegt.
# Ohne diese Ausnahme wird jede Anfrage vor dem Verlassen des Containers
# verworfen. Die Liste erwartet Host:Port.
speech:
  tts:
    # AUSNAHME VON DER SONST GELTENDEN REGEL, dass hier keine Hostnamen und
    # Ports stehen -- bewusst und abgesprochen. Es geht technisch nicht anders:
    # die Zod-Pruefung dieses Feldes laeuft VOR der Aufloesung von ${...} und
    # verwirft eine Referenz als ungueltiges host:port. Der Prozess beendet
    # sich dann beim Start. Eine Umgebungsvariable fuer die Ausnahmeliste gibt
    # es nicht. Ohne den Eintrag blockt der SSRF-Schutz jede Anfrage, denn er
    # zaehlt den Bereich 100.64/10 zu den privaten Adressen.
    allowedAddresses:
      - "zurich.tortoise-bramble.ts.net:20100"
    openai:
      # Literal, nicht referenziert: openAIProvider liest dieses Feld roh.
      # Ein ${...} bleibt stehen, new URL() wirft "Invalid URL", und der
      # Fehler entsteht vor dem inneren try -- im Log steht dann nur die
      # nichtssagende Sammelmeldung. Nur apiKey wird aufgeloest.
      url: "http://zurich.tortoise-bramble.ts.net:20100/v1/audio/speech"
      apiKey: "${BIFROST_AUTH}"
      # Gemini TTS gibt nativ nur PCM aus; der Gateway transkodiert nach MP3.
      # LibreChat sendet gar kein response_format, genau das trifft den
      # richtigen Pfad -- ein explizites "mp3" wuerde der Anbieter ablehnen.
      model: "gemini/gemini-3.1-flash-tts-preview"
      # Eigene Stimmnamen. Die OpenAI-Namen alloy/echo/fable/onyx/shimmer
      # quittiert der Anbieter mit 400; nur diese fuenf sind geprueft.
      voices:
        - "Kore"
        - "Puck"
        - "Charon"
        - "Zephyr"
        - "nova"
  stt:
    # AUSNAHME VON DER SONST GELTENDEN REGEL, dass hier keine Hostnamen und
    # Ports stehen -- bewusst und abgesprochen. Es geht technisch nicht anders:
    # die Zod-Pruefung dieses Feldes laeuft VOR der Aufloesung von ${...} und
    # verwirft eine Referenz als ungueltiges host:port. Der Prozess beendet
    # sich dann beim Start. Eine Umgebungsvariable fuer die Ausnahmeliste gibt
    # es nicht. Ohne den Eintrag blockt der SSRF-Schutz jede Anfrage, denn er
    # zaehlt den Bereich 100.64/10 zu den privaten Adressen.
    allowedAddresses:
      - "zurich.tortoise-bramble.ts.net:20100"
    openai:
      # Literal, siehe Begruendung beim TTS-Block weiter oben.
      url: "http://zurich.tortoise-bramble.ts.net:20100/v1/audio/transcriptions"
      apiKey: "${BIFROST_AUTH}"
      # Anbieter in der EU, gegen eine echte Aufnahme geprueft: gibt den Satz
      # zeichengenau zurueck, mit Umlauten, Eszett und Interpunktion, und
      # ohne das fuehrende Leerzeichen, das die anderen Whisper-Varianten
      # voranstellen.
      model: "Eurouter/faster-whisper-large-v3"
  speechTab:
    # Vorbelegung der Nutzereinstellungen. Jeder kann sie im Profil aendern.
    conversationMode: false   # Freihand-Dialog: Antwort wird sofort vorgelesen
    advancedMode: false       # zeigt Regler fuer Pausenerkennung und Schwellen
    # NICHT auf true abkuerzen. Der Client setzt dann engineSTT auf seinen
    # Vorgabewert "browser", benutzt also die Web-Speech-API des Browsers:
    # das Mikrofon wird angefordert, die Aufnahme bricht nach einem Moment
    # ab, und am Server kommt nie eine Anfrage an. "external" ist der Weg
    # ueber den oben konfigurierten Anbieter.
    speechToText:
      engineSTT: "external"
      languageSTT: "de-DE"
      # Nach dem Loslassen sofort transkribieren, statt auf einen zweiten
      # Klick zu warten.
      autoTranscribeAudio: true
    textToSpeech:
      # Wie oben: "external" ist der Weg ueber den Server. Der Anbieter
      # selbst wird aus speech.tts.openai gelesen, nicht aus diesem Feld --
      # es entscheidet nur, ob der Client den Browser oder den Server nimmt.
      engineTTS: "external"
      voice: "Kore"
      automaticPlayback: false

memory:
  disabled: false
  personalize: true
  tokenLimit: 4000
  charLimit: 10000
  maxInputTokens: 12000
  messageWindowSize: 8
  validKeys:
    - preferences
    - facts
    - projects
    - people
    - decisions
    - corrections
    - context
    - personal_info
    - conversation_context
    - user_preferences
    - learned_facts
  instructions: |
    You are a memory extraction agent. Analyze the conversation and extract information worth remembering.
    Be PROACTIVE — do not wait for the user to say "remember this". Extract automatically when you detect:
    - User preferences, habits, or opinions
    - Personal facts (name, role, location, expertise)
    - People mentioned (colleagues, friends, contacts) and their roles
    - Project names, goals, deadlines, or technical decisions
    - Corrections the user makes (what was wrong, what is right)
    - Important context that would help personalize future conversations
    Store each fact as a concise key-value pair. Use the most specific key that fits.
    If a fact updates an existing memory, overwrite it. If contradicted, delete the old entry.
    When in doubt, store it — it is better to remember too much than too little.
  # Der Gedaechtnis-Agent laeuft bei jeder Nachricht mit. Zeigt er auf ein
  # Modell, das der Endpunkt nicht kennt, scheitert er jedes Mal -- und der
  # Fehlschlag faellt in denselben Lauf wie die Antwort.
  # 'provider' ist der Name des Endpunkts, 'model' muss exakt so heissen wie
  # beim Gateway.
  agent:
    enabled: true
    provider: "Bifrost"
    model: "Eurouter/deepseek-v4-flash-0731"
    model_parameters:
      temperature: 0.2
      max_tokens: 2000
      top_p: 0.8
      frequency_penalty: 0.1

mcpServers:
  bifrost-mcp:
    type: streamable-http
    url: "${MCP_URL}"
    headers:
      Authorization: "Basic ${MCP_GATEWAY_AUTH}"
      x-bf-vk: "${MCP_GATEWAY_API_KEY_ADMIN}"
    timeout: 120000

webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngSearchOptions:
    engines: "google,duckduckgo,brave,startpage"
    language: "all"
    timeout: 10000
  tavilyApiKey: "${TAVILY_API_KEY}"
  jinaApiKey: "${JINA_API_KEY}"
  cohereApiKey: "${COHERE_API_KEY}"
  rerankerType: "jina"
  scraperTimeout: 7500
  safeSearch: 1

messageFilter:
  pii:
    starterPatterns:
      - sk_prefix
      - bearer_header
      - api_key_header
    customPatterns:
      - id: anthropic_api_key
        label: Anthropic API key
        regex: 'sk-ant-[A-Za-z0-9_-]{20,}'

summarization:
  provider: 'openAI'
  model: "cinf/gpt-5.4-mini"
  maxSummaryTokens: 4096
  reserveRatio: 0.05
  trigger:
    type: 'token_ratio'
    value: 0.8
  retainRecent:
    turns: 2
    tokens: 2000
  contextPruning:
    enabled: true
    keepLastAssistants: 3
    softTrimRatio: 0.3
    hardClearRatio: 0.5
    minPrunableToolChars: 50000
    softTrim:
      maxChars: 4000
      headChars: 1500
      tailChars: 1500
    hardClear:
      enabled: true
      placeholder: '[Old tool result content cleared]'
