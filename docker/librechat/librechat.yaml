version: "1.3.14"
cache: true

# Bootstrap the built-in USER role as a quarantine role. New registrations keep
# these permissions until an administrator assigns STUDENT or TEACHER access.
# Role-specific model and endpoint visibility is managed through Admin Panel
# configuration overrides.
interface:
  mcpServers:
    use: false
    create: false
    share: false
    public: false
    configureObo: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: false
  memories: false
  multiConvo: false
  agents:
    use: false
    create: false
    share: false
    public: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  skills:
    use: false
    create: false
    share: false
    public: false
    defaultActiveOnShare: false
  sharedLinks:
    create: false
    share: false
    public: false
    snapshotFiles: false
  temporaryChat: false
  runCode: false
  webSearch: false
  fileSearch: false
  fileCitations: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false

registration:
  socialLogins:
    - google
    - openid

endpoints:
  custom:
    - name: ${LLM_GATEWAY_NAME}
      apiKey: ${LLM_GATEWAY_API_KEY_ADMIN}
      baseURL: ${LLM_GATEWAY_BASEURL}
      models:
        default:
          - ${LLM_MODEL}
        fetch: true
      titleConvo: true
      titleModel: ${LLM_MODEL}
      modelDisplayLabel: ${MODEL_DISPLAY_LABEL}

ocr:
  apiKey: ${LLM_GATEWAY_API_KEY_ADMIN}
  baseURL: ${LLM_GATEWAY_BASEURL}
  allowedAddresses: ["ocr.internal:8080"]
  strategy: "custom_ocr"

memory:
  disabled: false
  personalize: true
  tokenLimit: 4000
  charLimit: 10000
  maxInputTokens: 12000
  messageWindowSize: 8
  validKeys:
    - preferences
    - facts
    - projects
    - people
    - decisions
    - corrections
    - context
    - personal_info
    - conversation_context
    - user_preferences
    - learned_facts
  instructions: |
    You are a memory extraction agent. Analyze the conversation and extract information worth remembering.
    Be PROACTIVE — do not wait for the user to say "remember this". Extract automatically when you detect:
    - User preferences, habits, or opinions
    - Personal facts (name, role, location, expertise)
    - People mentioned (colleagues, friends, contacts) and their roles
    - Project names, goals, deadlines, or technical decisions
    - Corrections the user makes (what was wrong, what is right)
    - Important context that would help personalize future conversations
    Store each fact as a concise key-value pair. Use the most specific key that fits.
    If a fact updates an existing memory, overwrite it. If contradicted, delete the old entry.
    When in doubt, store it — it is better to remember too much than too little.
  agent:
    enabled: true
    provider: ${LLM_PROVIDER}
    model: ${LLM_MODEL}
    model_parameters:
          temperature: 0.2
          max_tokens: 2000
          top_p: 0.8
          frequency_penalty: 0.1

mcpServers:
  bifrost-mcp:
    type: streamable-http
    url: ${MCP_URL}
    headers:
      Authorization: "Basic ${MCP_GATEWAY_AUTH}"
      x-bf-vk: "${MCP_GATEWAY_API_KEY_ADMIN}"
    timeout: 120000

webSearch:
  # Search Provider Configuration
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngApiKey: "${SEARXNG_API_KEY}"
  searchProvider: "searxng" # Options: "serper", "searxng", "tavily"
  # Optional: query options sent to a SearXNG instance
  allowedAddresses:
      - "localhost:55011"
  searxngSearchOptions:
    engines: "google,duckduckgo,brave,startpage" # Default: "google,bing,duckduckgo"
    language: "all" # Default: "all"
    timeout: 10000
  # Tavily Configuration (search and/or scraper)
  tavilyApiKey: "${TAVILY_API_KEY}"
  # Optional: custom Tavily-compatible endpoints
  tavilySearchUrl: "${TAVILY_SEARCH_URL}"
  tavilyExtractUrl: "${TAVILY_EXTRACT_URL}"

# Reranker Configuration
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  cohereApiKey: "${COHERE_API_KEY}"
  rerankerType: "jina" # Options: "jina", "cohere", "none"

# General Settings
  scraperTimeout: 7500 # Timeout in milliseconds for scraper requests (default: 7500)
  safeSearch: 1 # Options: 0 (OFF), 1 (MODERATE - default), 2 (STRICT)
  # Required for deliberately private self-hosted provider endpoints

messageFilter:
  pii:
    starterPatterns:
      - sk_prefix
      - bearer_header
      - api_key_header
    customPatterns:
      - id: anthropic_api_key
        label: Anthropic API key
        regex: 'sk-ant-[A-Za-z0-9_-]{20,}'

summarization:
  provider: 'openAI'
  model: 'gpt-5.4-mini'
  maxSummaryTokens: 4096
  reserveRatio: 0.05
  trigger:
    type: 'token_ratio'
    value: 0.8
  retainRecent:
    turns: 2
    tokens: 2000
  contextPruning:
    enabled: true
    keepLastAssistants: 3
    softTrimRatio: 0.3
    hardClearRatio: 0.5
    minPrunableToolChars: 50000
    softTrim:
      maxChars: 4000
      headChars: 1500
      tailChars: 1500
    hardClear:
      enabled: true
      placeholder: '[Old tool result content cleared]'
