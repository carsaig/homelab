server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Beide Seiten ohne und mit Schraegstrich, plus das gemeinsame Stylesheet
    # unter jedem der beiden Praefixe, damit ein einzelner PathPrefix-Router
    # in Traefik genuegt.
    location = /privacy        { try_files /privacy.html =404; }
    location = /privacy/       { try_files /privacy.html =404; }
    location = /terms          { try_files /terms.html   =404; }
    location = /terms/         { try_files /terms.html   =404; }
    location ~ ^/(privacy|terms)/_style\.css$ {
        default_type text/css;
        try_files /_style.css =404;
    }

    location / { return 404; }
}
