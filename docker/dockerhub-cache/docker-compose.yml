# Pull-through cache for Docker Hub, reachable over the private network.
#
# Companion to the ghcr cache: one upstream per instance is a hard limit of this
# registry implementation, so each remote gets its own.
#
# DOCKERHUB_CACHE_BIND binds it to the private interface only, DOCKERHUB_CACHE_DATA points at the
# cache directory. Both come from the stack's environment.
services:
  dockerhub-cache:
    image: registry:3
    container_name: dockerhub-cache
    restart: unless-stopped
    ports:
      - ${DOCKERHUB_CACHE_BIND}
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - ${DOCKERHUB_CACHE_DATA}:/var/lib/registry
