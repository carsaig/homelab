services:
  dokploy-mcp:
    image: node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    command: ["npx", "--yes", "@dokploy/mcp@0.29.14", "--http"]
    expose:
      - "3000"
    environment:
      MCP_TRANSPORT: http
      DOKPLOY_URL: ${DOKPLOY_URL}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
  dokploy-mcp-proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      dokploy-mcp:
        condition: service_healthy
    environment:
      MCP_PROXY_BEARER_TOKEN: ${MCP_PROXY_BEARER_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - ${MCP_PROXY_PORTS}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
