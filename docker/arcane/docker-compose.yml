services:
  arcane:
    # Pinned deliberately. The in-app updater derives its target from this tag,
    # so a pin makes self-update a no-op by design — version changes land here.
    image: ghcr.io/getarcaneapp/arcane:v2.9.0
    container_name: arcane
    restart: unless-stopped
    ports:
      # Bound to a private management address only, never the public interface.
      # A reverse proxy is the sole ingress path.
      - ${ARCANE_BIND}
    environment:
      GIN_MODE: release
      ENVIRONMENT: production
      PORT: "3552"
      APP_URL: ${ARCANE_APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      # Trust X-Forwarded-* headers only from the reverse proxy.
      TRUSTED_PROXIES: ${ARCANE_TRUSTED_PROXIES}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Build workspace, deliberately outside ./data so build contexts and caches
      # can be wiped or excluded from backups without touching the database.
      # The application runs unprivileged and cannot create directories at the
      # container root, so this path must exist and be owned by the application
      # user before the container starts — see the prepare step in the workflow.
      - ./builds:/builds
