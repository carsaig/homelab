# Forgejo Actions runner for git.certain.cc, running on zurich-1.
#
# Deployed by Arcane's git sync rather than by a workflow: git holds the compose,
# Arcane reconciles it onto the host and supplies runtime values through the
# project's .env. Do not add a deploy workflow for this — two actors writing the
# same stack will fight over it.
#
# Registration happens once, out of band, and writes a .runner file holding a
# runner token. Re-registering creates a second runner in Forgejo and orphans
# this one.
services:
  runner:
    image: code.forgejo.org/forgejo/runner:13.0.0
    container_name: forgejo-runner
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /data
    command: forgejo-runner daemon

    # certain.cc is resolved by Tailscale MagicDNS as a routed domain on
    # tailscale0. Containers do not inherit the host's systemd-resolved stub at
    # 127.0.0.53, so without this nothing in here resolves git.certain.cc — and
    # registration hangs rather than failing, which makes it easy to misread.
    dns:
      - 100.100.100.100

    # gid of the docker group on zurich-1. Required because the container runs as
    # uid 1000 and the socket is root:docker 0660.
    group_add:
      - "988"

    environment:
      DOCKER_HOST: unix:///var/run/docker.sock

    volumes:
      # Absolute rather than relative to the compose file: this holds the .runner
      # registration, which belongs to the host and not to whichever directory a
      # deploy happens to run from. Arcane places project files under its own
      # data directory, so a relative path would silently start an unregistered
      # runner.
      - /mnt/data/forgejo-runner/data:/data

      # Jobs run against the host daemon. They share its layer cache and show up
      # in Arcane alongside everything else, at the cost of being able to control
      # that daemon. Acceptable here: only this account pushes to the
      # repositories this runner serves.
      - /var/run/docker.sock:/var/run/docker.sock
