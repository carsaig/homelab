services:
  tsidp:
    container_name: tsidp
    image: ghcr.io/tailscale/tsidp:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - tsidp-data:/data
    environment:
      - TAILSCALE_USE_WIP_CODE=1
      - TS_STATE_DIR=/data
      - TS_HOSTNAME=${HOSTNAME}
      - TS_AUTHKEY=
      - TSNET_FORCE_LOGIN=0
      - TSIDP_LOG=debug
      - TSIDP_ENABLE_STS=1
      - TSIDP_USE_FUNNEL=1

volumes:
  tsidp-data:
    external: true
    name: ${VOLUME_TSIDP}
