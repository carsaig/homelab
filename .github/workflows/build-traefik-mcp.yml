name: Build traefik-mcp image

# Builds and publishes ghcr.io/<owner>/traefik-mcp for linux/arm64 only.
# Native arm64 runner — no QEMU/buildx cross-emulation, no multi-arch manifest.
# Version tag is read from the Dockerfile's IMAGE_VERSION ARG.

on:
  push:
    branches: [main]
    paths:
      - "docker/mcp/traefik/**"
      - ".github/workflows/build-traefik-mcp.yml"
  workflow_dispatch: {}

concurrency:
  group: build-traefik-mcp
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pinned image version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP 'IMAGE_VERSION=\K[0-9][0-9A-Za-z.+-]*' docker/mcp/traefik/Dockerfile)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: docker/mcp/traefik
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/traefik-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/traefik-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
