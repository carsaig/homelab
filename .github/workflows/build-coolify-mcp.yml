name: Build coolify-mcp image

on:
  push:
    branches: [main]
    paths:
      - "docker/coolify-mcp/**"
      - ".github/workflows/build-coolify-mcp.yml"
  workflow_dispatch: {}

concurrency:
  group: build-coolify-mcp
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pinned upstream version and image revision
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP 'COOLIFY_MCP_VERSION=\K[0-9][0-9.]*' docker/coolify-mcp/Dockerfile)
          rev=$(grep -oP 'IMAGE_REV=\K[0-9]+' docker/coolify-mcp/Dockerfile)
          echo "tag=${version}-${rev}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: docker/coolify-mcp
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coolify-mcp-gateway:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/coolify-mcp-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
