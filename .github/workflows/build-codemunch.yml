name: Build codemunch image

# Builds and publishes ghcr.io/<owner>/codemunch for linux/arm64 only.
# Native arm64 runner — no QEMU/buildx cross-emulation, no multi-arch manifest.
# Version tag is read from the Dockerfile's JCODEMUNCH_VERSION ARG, so bumping
# that one line is the only change needed to publish a new codemunch version.

on:
  push:
    branches: [main]
    paths:
      - "docker/codemunch/**"
      - ".github/workflows/build-codemunch.yml"
  workflow_dispatch: {}

concurrency:
  group: build-codemunch
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pinned codemunch version + wrapper rev
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP 'JCODEMUNCH_VERSION=\K[0-9][0-9.]*' docker/codemunch/Dockerfile)
          rev=$(grep -oP 'CODEMUNCH_REV=\K[0-9]+' docker/codemunch/Dockerfile)
          echo "tag=${version}-r${rev}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: docker/codemunch
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codemunch:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/codemunch:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
